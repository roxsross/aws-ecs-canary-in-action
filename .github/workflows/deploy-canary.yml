# ---------------------------------------------------------------------------
# Canary rollout from CI, using ECS's native deployment strategy.
#
# Setup, once:
#   1. terraform apply the stack, with a remote backend so CI can read its state
#   2. repository secret   AWS_ROLE_ARN    an IAM role CI can assume via OIDC
#   3. repository variables
#        AWS_REGION    us-east-1
#        PROJECT_NAME  canary-lab
#
# No long lived access keys: the job assumes a role through OIDC. There is no
# separate "promote" step: canary_percent, canary_bake_time_in_minutes and
# bake_time_in_minutes in infra/terraform/ecs.tf drive the whole rollout,
# including shifting the remaining traffic and terminating the old revision.
# ---------------------------------------------------------------------------
name: Deploy canary

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to roll out (also used as APP_VERSION)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # One rollout at a time: ECS only runs one deployment per service anyway.
  group: canary-rollout
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME || 'canary-lab' }}

jobs:
  build:
    name: Build and push ${{ inputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: canary-build-${{ github.run_id }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        id: push
        run: |
          image=$(./scripts/build-push.sh \
            --tag "${{ inputs.tag }}" \
            --project "${PROJECT_NAME}" \
            --region "${AWS_REGION}" \
            | tail -1)
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "### Image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${image}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  rollout:
    name: Canary rollout
    needs: build
    runs-on: ubuntu-latest
    # Point this at a GitHub environment with reviewers to gate the rollout itself.
    environment: canary
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: canary-rollout-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false

      - name: Load the deployment environment
        run: |
          terraform -chdir=infra/terraform init -input=false
          ./scripts/load-env.sh --region "${AWS_REGION}"

      - name: State before the rollout
        run: |
          {
            echo "### Before"
            echo '```json'
            ./scripts/status.sh --json | jq '{service, targets, alarmsFiring}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Canary rollout
        run: |
          ./scripts/canary-deploy.sh \
            --image "${{ needs.build.outputs.image }}" \
            --version "${{ inputs.tag }}" \
            --yes

      - name: State after the rollout
        if: always()
        run: |
          {
            echo "### After"
            echo '```json'
            ./scripts/status.sh --json | jq '{service, targets, alarmsFiring}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # canary-deploy.sh polls ECS's own rollout state; ECS rolls back on its
      # own when an alarm fires. This is the belt and braces for anything else
      # that could kill the job, like a runner timeout partway through.
      - name: Make sure the previous revision is running if the rollout failed
        if: failure()
        run: |
          echo "the rollout did not complete, checking whether traffic is already on the previous revision" >&2
          ./scripts/status.sh --json | jq -r '.service.rolloutState' >&2
          {
            echo "### Rollout did not complete"
            echo "Check the job log and \`./scripts/status.sh\`. If ECS's own rollback didn't"
            echo "already revert it, run \`./scripts/rollback.sh\`."
          } >> "$GITHUB_STEP_SUMMARY"
