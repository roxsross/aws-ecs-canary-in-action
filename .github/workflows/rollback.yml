# ---------------------------------------------------------------------------
# The break glass workflow: redeploy the previous task definition revision.
#
# With ECS's native canary strategy, a rollout already in progress is watched
# by ECS itself (deployment_configuration.alarms in infra/terraform/ecs.tf)
# and rolls back on its own if an alarm fires. This workflow is for cutting a
# healthy-looking rollout short on purpose, or for reverting a revision that
# already reached COMPLETED and is serving 100% of traffic.
# ---------------------------------------------------------------------------
name: Rollback

on:
  workflow_dispatch:
    inputs:
      to_task_definition:
        description: "family:revision or ARN to roll back to (leave empty for the previous one)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  # Deliberately the same group as the rollout, so a rollback queues behind (and
  # then corrects) whatever a rollout was doing.
  group: canary-rollout
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME || 'canary-lab' }}

jobs:
  rollback:
    name: Redeploy the previous revision
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: canary-rollback-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false

      - name: Load the deployment environment
        run: |
          terraform -chdir=infra/terraform init -input=false
          ./scripts/load-env.sh --region "${AWS_REGION}"

      - name: State before
        run: |
          {
            echo "### Before"
            echo '```json'
            ./scripts/status.sh --json | jq '{service, alarmsFiring}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back
        run: |
          args="--yes"
          if [ -n "${{ inputs.to_task_definition }}" ]; then
            args="$args --to ${{ inputs.to_task_definition }}"
          fi
          # shellcheck disable=SC2086
          ./scripts/rollback.sh $args

      - name: State after
        if: always()
        run: |
          {
            echo "### After"
            echo '```json'
            ./scripts/status.sh --json | jq '{service, targets, alarmsFiring}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
