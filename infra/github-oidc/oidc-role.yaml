AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  GitHub Actions OIDC provider and deployment role for the ECS canary lab.
  Gives the workflows short lived credentials instead of stored access keys.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Who is allowed to assume the role" }
        Parameters: [GitHubOrg, GitHubRepo, AllowedRefs, CreateOidcProvider]
      - Label: { default: "What the role is allowed to do" }
        Parameters: [PermissionScope, ProjectName]

Parameters:
  GitHubOrg:
    Type: String
    Default: roxsross
    Description: GitHub organisation or user that owns the repository.

  GitHubRepo:
    Type: String
    Default: aws-ecs-canary-in-action
    Description: Repository name.

  AllowedRefs:
    Type: String
    Default: "*"
    Description: >-
      Which workflow contexts may assume the role, as the GitHub subject suffix.
      "*" allows any branch, tag and environment. Tighten it for real use, for
      example "ref:refs/heads/main" or "environment:production".

  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Set to false if this account already has the token.actions.githubusercontent.com
      provider. An account can only have one, and a second stack would fail.

  ProjectName:
    Type: String
    Default: canary-lab
    Description: Resource prefix used to scope the deployment permissions.

  PermissionScope:
    Type: String
    Default: deploy
    AllowedValues: [deploy, infrastructure]
    Description: >-
      deploy         push images and drive rollouts on an existing stack (recommended)
      infrastructure also create and destroy the stack itself, which needs broad
                     permissions including IAM role creation

Conditions:
  ShouldCreateProvider: !Equals [!Ref CreateOidcProvider, "true"]
  IsInfrastructure: !Equals [!Ref PermissionScope, "infrastructure"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # AWS validates the GitHub provider's certificate chain itself, so the
      # thumbprint no longer has to be kept up to date. This value is the one
      # AWS documents as a placeholder.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  DeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-github-actions"
      Description: !Sub "GitHub Actions deployments for ${GitHubOrg}/${GitHubRepo}"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateProvider
                - !Ref GitHubOidcProvider
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # Restricts the trust to this repository, and optionally to a
              # specific branch or environment.
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}/${GitHubRepo}:${AllowedRefs}"

      Policies:
        - PolicyName: canary-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # ---- push images ----
              - Sid: EcrAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrRepository
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:CreateRepository
                  - ecr:DescribeImages
                  - ecr:DescribeRepositories
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:ListImages
                  - ecr:PutImage
                  - ecr:PutLifecyclePolicy
                  - ecr:TagResource
                  - ecr:UploadLayerPart
                Resource: !Sub "arn:${AWS::Partition}:ecr:*:${AWS::AccountId}:repository/${ProjectName}*"

              # ---- drive the rollout ----
              - Sid: EcsRead
                Effect: Allow
                Action:
                  - ecs:DescribeClusters
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:DescribeTasks
                  - ecs:ListTaskDefinitions
                  - ecs:ListTasks
                Resource: "*"
              - Sid: EcsWrite
                Effect: Allow
                Action:
                  - ecs:RegisterTaskDefinition
                  - ecs:TagResource
                Resource: "*"
              - Sid: EcsUpdateService
                Effect: Allow
                Action: ecs:UpdateService
                Resource: !Sub "arn:${AWS::Partition}:ecs:*:${AWS::AccountId}:service/${ProjectName}/${ProjectName}-*"

              # Needed so RegisterTaskDefinition may reference the task roles.
              - Sid: PassTaskRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-task"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-execution"
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com

              # ---- move the traffic ----
              - Sid: LoadBalancerRead
                Effect: Allow
                Action:
                  - elasticloadbalancing:DescribeListeners
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeRules
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeTargetHealth
                Resource: "*"
              - Sid: LoadBalancerShiftWeights
                Effect: Allow
                Action:
                  - elasticloadbalancing:ModifyListener
                  - elasticloadbalancing:ModifyRule
                Resource: "*"

              # ---- read the stack outputs and the alarms ----
              - Sid: CloudFormationRead
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplate
                  - cloudformation:ListStacks
                Resource: "*"
              - Sid: AlarmsRead
                Effect: Allow
                Action:
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetMetricStatistics
                Resource: "*"
              # The rollout clears stale alarm state before it starts.
              - Sid: AlarmsSetState
                Effect: Allow
                Action: cloudwatch:SetAlarmState
                Resource: !Sub "arn:${AWS::Partition}:cloudwatch:*:${AWS::AccountId}:alarm:${ProjectName}-*"
              - Sid: LogsRead
                Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:FilterLogEvents
                  - logs:GetLogEvents
                Resource: "*"

        # Broad by design: creating the stack means creating IAM roles, load
        # balancers and everything else. Prefer the deploy scope and run
        # `terraform apply` from a workstation if that is too much.
        - !If
          - IsInfrastructure
          - PolicyName: canary-infrastructure
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: ManageTheStack
                  Effect: Allow
                  Action:
                    - cloudformation:*
                    - dynamodb:*
                    - ec2:AuthorizeSecurityGroup*
                    - ec2:CreateSecurityGroup
                    - ec2:CreateTags
                    - ec2:Delete*
                    - ec2:Describe*
                    - ec2:RevokeSecurityGroup*
                    - ecr:*
                    - ecs:*
                    - elasticloadbalancing:*
                    - logs:*
                    - cloudwatch:*
                    - application-autoscaling:*
                  Resource: "*"
                - Sid: ManageStackRoles
                  Effect: Allow
                  Action:
                    - iam:AttachRolePolicy
                    - iam:CreateRole
                    - iam:DeleteRole
                    - iam:DeleteRolePolicy
                    - iam:DetachRolePolicy
                    - iam:GetRole
                    - iam:GetRolePolicy
                    - iam:ListAttachedRolePolicies
                    - iam:ListInstanceProfilesForRole
                    - iam:ListRolePolicies
                    - iam:PassRole
                    - iam:PutRolePolicy
                    - iam:TagRole
                    - iam:UntagRole
                    - iam:UpdateRole
                  Resource:
                    - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-*"
                - Sid: TerraformStateAccess
                  Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:PutObject
                    - s3:DeleteObject
                    - s3:ListBucket
                  Resource: "*"
          - !Ref AWS::NoValue

      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Component, Value: github-oidc }

Outputs:
  RoleArn:
    Description: Put this in the AWS_ROLE_ARN repository secret.
    Value: !GetAtt DeploymentRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-RoleArn"

  SubjectPattern:
    Description: The workflow contexts allowed to assume the role.
    Value: !Sub "repo:${GitHubOrg}/${GitHubRepo}:${AllowedRefs}"

  NextSteps:
    Description: What to configure in GitHub.
    Value: !Sub >-
      gh secret set AWS_ROLE_ARN --body ${DeploymentRole.Arn} ;
      gh variable set AWS_REGION --body ${AWS::Region} ;
      gh variable set PROJECT_NAME --body ${ProjectName}
